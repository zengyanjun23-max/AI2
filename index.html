<script>
let abortController = null;
let currentBase64Image = null;

window.onload = () => { loadHistory(); };

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function handleImageSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        currentBase64Image = event.target.result;
        document.getElementById("imagePreviewArea").innerHTML = `<img src="${currentBase64Image}" class="thumb-preview">`;
    };
    reader.readAsDataURL(file);
}

async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    const selectedLang = document.getElementById("languageSelect").value;
    
    if (!text && !currentBase64Image) return;

    const chatBox = document.getElementById("chatBox");

    const userDiv = document.createElement("div");
    userDiv.className = "message user-message";
    if (currentBase64Image) {
        userDiv.innerHTML += `<img src="${currentBase64Image}" class="preview-img"><br>`;
    }
    userDiv.innerHTML += text;
    chatBox.appendChild(userDiv);

    input.value = "";
    document.getElementById("imagePreviewArea").innerHTML = "";
    const sendImg = currentBase64Image;
    currentBase64Image = null;

    const aiDiv = document.createElement("div");
    aiDiv.className = "message ai-message";
    aiDiv.innerText = "思考中...";
    chatBox.appendChild(aiDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    document.getElementById("stopBtn").style.display = "inline-block";
    document.getElementById("sendBtn").style.display = "none";

    abortController = new AbortController();

    try {
        const response = await fetch("https://ai2-9ewx.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: abortController.signal,
            body: JSON.stringify({ 
                message: text,
                image: sendImg ? sendImg.split(',')[1] : null,
                language: selectedLang
            })
        });

        if (!response.ok) throw new Error("Server status: " + response.status);

        // 讀取回應內容（自動兼容文本與JSON）
        const rawText = await response.text();
        let finalText = rawText;

        try {
            const jsonObj = JSON.parse(rawText);
            if (jsonObj.reply) finalText = jsonObj.reply;
        } catch (e) {
            // 代表是純文字串流，直接使用原內容
        }

        aiDiv.innerText = finalText;
        saveToHistory(text || "圖片分析", finalText);

    } catch (err) {
        if (err.name === 'AbortError') {
            aiDiv.innerText += " [已停止生成]";
        } else {
            aiDiv.innerText = "連線失敗，請檢查網路或稍後再試。";
            console.error(err);
        }
    } finally {
        document.getElementById("stopBtn").style.display = "none";
        document.getElementById("sendBtn").style.display = "inline-block";
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

function stopGeneration() {
    if (abortController) abortController.abort();
}

function startNewChat() {
    document.getElementById("chatBox").innerHTML = "";
}

function saveToHistory(prompt, reply) {
    let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
    history.unshift({ prompt, reply });
    localStorage.setItem("chatHistory", JSON.stringify(history));
    loadHistory();
}

function loadHistory() {
    const historyList = document.getElementById("historyList");
    let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
    historyList.innerHTML = "";
    history.forEach((item) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerText = item.prompt;
        historyList.appendChild(div);
    });
}
</script>
