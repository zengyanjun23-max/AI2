<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 對話助手</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }
        .chat-input button {
            margin-left: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .chat-input button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">AI 對話助手</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">發送</button>
    </div>
</div>

<script>
async function sendMessage() {
    const inputField = document.getElementById("userInput");
    const text = inputField.value.trim();
    if (!text) return;

    const chatBox = document.getElementById("chatBox");

    // 渲染使用者訊息
    const userMsg = document.createElement("div");
    userMsg.className = "message user-message";
    userMsg.innerText = text;
    chatBox.appendChild(userMsg);

    inputField.value = "";

    // 渲染 AI 載入中訊息
    const aiMsg = document.createElement("div");
    aiMsg.className = "message ai-message";
    aiMsg.innerText = "AI 思考中（若是首次發送，需等候伺服器喚醒）...";
    chatBox.appendChild(aiMsg);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        // 正確帶入 /api/chat 完整路徑
        const response = await fetch("https://ai2-9ewx.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        if (!response.ok) {
            throw new Error(`HTTP 錯誤狀態: ${response.status}`);
        }

        const data = await response.json();
        aiMsg.innerText = data.reply;
    } catch (error) {
        aiMsg.innerText = "連線失敗，請稍後再試。";
        console.error("Fetch Error:", error);
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
