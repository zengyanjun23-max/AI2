<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #2d2f31; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .lang-select { background-color: #2b2c2e; color: #e3e3e3; border: 1px solid #3c4043; padding: 6px 12px; border-radius: 16px; font-size: 14px; outline: none; }
        
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background-color: #2b2c2e; color: #e3e3e3; border-bottom-right-radius: 4px; }
        .ai-message { align-self: flex-start; background-color: transparent; color: #e3e3e3; border-bottom-left-radius: 4px; }
        .preview-img { max-width: 200px; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block; }

        .input-container { padding: 20px; background-color: #131314; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .input-box { width: 100%; max-width: 800px; background-color: #1e1f20; border-radius: 28px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; border: 1px solid #3c4043; }
        .input-box textarea { flex: 1; background: transparent; border: none; outline: none; color: white; resize: none; height: 24px; font-size: 15px; }
        
        .btn-icon { background: none; border: none; color: #c4c7c5; cursor: pointer; font-size: 18px; padding: 6px; border-radius: 50%; }
        .btn-icon:hover { background-color: #2d2f31; color: white; }
        .stop-btn { background-color: #d93025; color: white; border: none; padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 13px; display: none; }
        #imagePreviewArea { width: 100%; max-width: 800px; display: flex; gap: 10px; }
        .thumb-preview { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="chat-header">
        <span>Gemini AI Assistant</span>
        <select id="languageSelect" class="lang-select">
            <option value="Traditional Chinese">繁體中文</option>
            <option value="English">English</option>
            <option value="Japanese">日本語</option>
        </select>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-container">
        <div id="imagePreviewArea"></div>
        <div class="input-box">
            <label class="btn-icon" title="上傳圖片">
                📷 <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
            </label>
            <textarea id="userInput" placeholder="問問 Gemini... (Enter 發送，Shift+Enter 換行)" rows="1" onkeydown="handleKeyDown(event)"></textarea>
            <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">停止生成</button>
            <button class="btn-icon" id="sendBtn" onclick="sendMessage()">➔</button>
        </div>
    </div>

<script>
let abortController = null;
let currentBase64Image = null;

// Enter 鍵處理：按下 Enter 直接發送，Shift + Enter 換行
function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

// 選擇圖片並顯示縮圖
function handleImageSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        currentBase64Image = event.target.result;
        const previewArea = document.getElementById("imagePreviewArea");
        if (previewArea) {
            previewArea.innerHTML = `<img src="${currentBase64Image}" class="thumb-preview">`;
        }
    };
    reader.readAsDataURL(file);
}

// 發送訊息
async function sendMessage() {
    const input = document.getElementById("userInput");
    if (!input) return;

    const text = input.value.trim();
    const langSelect = document.getElementById("languageSelect");
    const selectedLang = langSelect ? langSelect.value : "Traditional Chinese";
    
    if (!text && !currentBase64Image) return;

    const chatBox = document.getElementById("chatBox");
    if (!chatBox) return;

    // 建立使用者訊息框
    const userDiv = document.createElement("div");
    userDiv.className = "message user-message";
    if (currentBase64Image) {
        userDiv.innerHTML += `<img src="${currentBase64Image}" class="preview-img"><br>`;
    }
    userDiv.innerHTML += text;
    chatBox.appendChild(userDiv);

    // 清空輸入框與預覽圖
    input.value = "";
    const previewArea = document.getElementById("imagePreviewArea");
    if (previewArea) previewArea.innerHTML = "";
    
    const sendImg = currentBase64Image;
    currentBase64Image = null;

    // 建立 AI 訊息框
    const aiDiv = document.createElement("div");
    aiDiv.className = "message ai-message";
    aiDiv.innerText = "";
    chatBox.appendChild(aiDiv);

    // 控制按鈕顯示（顯示停止生成）
    const stopBtn = document.getElementById("stopBtn");
    const sendBtn = document.getElementById("sendBtn");
    if (stopBtn) stopBtn.style.display = "inline-block";
    if (sendBtn) sendBtn.style.display = "none";

    abortController = new AbortController();

    try {
        const response = await fetch("https://ai2-9ewx.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: abortController.signal,
            body: JSON.stringify({ 
                message: text,
                image: sendImg ? sendImg.split(',')[1] : null,
                language: selectedLang
            })
        });

        if (!response.ok) throw new Error("Server status: " + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            aiDiv.innerText += decoder.decode(value, { stream: true });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

    } catch (err) {
        if (err.name === 'AbortError') {
            aiDiv.innerText += " [已停止生成]";
        } else {
            aiDiv.innerText = "連線失敗，請檢查網路或 Render 後端。";
            console.error(err);
        }
    } finally {
        if (stopBtn) stopBtn.style.display = "none";
        if (sendBtn) sendBtn.style.display = "inline-block";
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

// 停止生成功能
function stopGeneration() {
    if (abortController) abortController.abort();
}
</script>
</body>
</html>
