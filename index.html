<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; height: 100vh; overflow: hidden; }

        /* 左側邊欄 Sidebar */
        .sidebar { width: 260px; background-color: #1e1f20; padding: 16px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #2d2f31; flex-shrink: 0; }
        .new-chat-btn { background-color: #1a73e8; color: white; border: none; padding: 12px 16px; border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; width: 100%; }
        .new-chat-btn:hover { background-color: #1557b0; }
        .sidebar-title { font-size: 12px; color: #8e918f; padding-left: 8px; font-weight: 600; text-transform: uppercase; margin-top: 10px; }

        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .history-item { padding: 10px 12px; border-radius: 12px; font-size: 14px; color: #c4c7c5; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background-color: #2d2f31; color: white; }
        .history-item.active { background-color: #004a77; color: #c2e7ff; }
        .delete-btn { opacity: 0; font-size: 12px; color: #a8c7fa; padding: 2px 6px; border-radius: 4px; }
        .history-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background-color: rgba(255, 255, 255, 0.2); }

        /* 主聊天區 Main Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; background-color: #131314; }
        .chat-header { padding: 16px 24px; border-bottom: 1px solid #2d2f31; font-size: 18px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .lang-select { background-color: #1e1f20; color: #e3e3e3; border: 1px solid #3c4043; padding: 6px 12px; border-radius: 16px; font-size: 13px; outline: none; cursor: pointer; }
        
        .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
        .message-row { display: flex; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
        .message-row.user { justify-content: flex-end; }
        
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .ai-avatar { background: linear-gradient(135deg, #4285f4, #9b51e0); color: white; }
        .user-avatar { background: #3c4043; color: white; }

        .message-content { padding: 12px 18px; border-radius: 18px; line-height: 1.6; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
        .user .message-content { background-color: #2b2c2e; border-bottom-right-radius: 4px; }
        .ai .message-content { background-color: transparent; border-bottom-left-radius: 4px; padding-left: 0; }
        .preview-img { max-width: 240px; max-height: 240px; border-radius: 12px; margin-bottom: 8px; display: block; }

        /* 輸入區域 Input Container */
        .input-container { padding: 16px 24px 24px; display: flex; flex-direction: column; align-items: center; background-color: #131314; }
        .input-wrapper { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 8px; }
        #imagePreviewArea { display: flex; gap: 10px; }
        .thumb-preview { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid #3c4043; }

        .input-box { background-color: #1e1f20; border-radius: 28px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid #3c4043; }
        .input-box:focus-within { border-color: #8e918f; }
        .input-box textarea { flex: 1; background: transparent; border: none; outline: none; color: white; resize: none; height: 24px; font-size: 15px; max-height: 120px; }
        
        .btn-icon { background: none; border: none; color: #c4c7c5; cursor: pointer; font-size: 18px; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background-color: #2d2f31; color: white; }
        .stop-btn { background-color: #d93025; color: white; border: none; padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 13px; font-weight: 500; display: none; }
        .send-btn { background-color: #e3e3e3; color: #131314; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .send-btn:hover { background-color: #ffffff; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">✨ 新對話</button>
        <div class="sidebar-title">歷史對話</div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span>Gemini</span>
            <select id="languageSelect" class="lang-select">
                <option value="Traditional Chinese">繁體中文</option>
                <option value="English">English</option>
                <option value="Japanese">日本語</option>
            </select>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-container">
            <div class="input-wrapper">
                <div id="imagePreviewArea"></div>
                <div class="input-box">
                    <label class="btn-icon" title="上傳圖片">
                        📷 <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                    </label>
                    <textarea id="userInput" placeholder="輸入提示詞或問題 (Enter 發送，Shift+Enter 換行)" rows="1" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">停止</button>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
                </div>
            </div>
        </div>
    </div>

<script>
let abortController = null;
let currentBase64Image = null;
let currentChatId = null;
let chatSessions = {};

// 初始化：讀取舊紀錄
window.onload = () => {
    loadSessionsFromStorage();
    renderHistoryList();
};

function loadSessionsFromStorage() {
    try {
        const stored = localStorage.getItem("gemini_chat_sessions");
        if (stored) {
            chatSessions = JSON.parse(stored);
        }
    } catch (e) {
        chatSessions = {};
    }
}

function saveSessionsToStorage() {
    localStorage.setItem("gemini_chat_sessions", JSON.stringify(chatSessions));
}

function renderHistoryList() {
    const list = document.getElementById("historyList");
    if (!list) return;
    list.innerHTML = "";

    const keys = Object.keys(chatSessions).sort((a, b) => b - a);
    keys.forEach(id => {
        const session = chatSessions[id];
        const item = document.createElement("div");
        item.className = `history-item ${id == currentChatId ? 'active' : ''}`;
        
        const titleSpan = document.createElement("span");
        titleSpan.style.overflow = "hidden";
        titleSpan.style.textOverflow = "ellipsis";
        titleSpan.innerText = session.title || "新對話";
        
        const delBtn = document.createElement("span");
        delBtn.className = "delete-btn";
        delBtn.innerText = "✕";
        delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteChat(id);
        };

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        item.onclick = () => switchChat(id);
        list.appendChild(item);
    });
}

function startNewChat() {
    currentChatId = null;
    const chatBox = document.getElementById("chatBox");
    if (chatBox) chatBox.innerHTML = "";
    renderHistoryList();
}

function switchChat(id) {
    currentChatId = id;
    renderHistoryList();
    const chatBox = document.getElementById("chatBox");
    if (!chatBox) return;
    chatBox.innerHTML = "";

    const session = chatSessions[id];
    if (!session || !session.messages) return;

    session.messages.forEach(msg => {
        const row = document.createElement("div");
        row.className = `message-row ${msg.role}`;
        
        let contentHtml = `<div class="message-content">`;
        if (msg.image) {
            contentHtml += `<img src="${msg.image}" class="preview-img">`;
        }
        contentHtml += `${escapeHtml(msg.text)}</div>`;

        if (msg.role === 'user') {
            row.innerHTML = contentHtml + `<div class="avatar user-avatar">你</div>`;
        } else {
            row.innerHTML = `<div class="avatar ai-avatar">✦</div>` + contentHtml;
        }
        chatBox.appendChild(row);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
}

function deleteChat(id) {
    delete chatSessions[id];
    saveSessionsToStorage();
    if (currentChatId == id) {
        startNewChat();
    } else {
        renderHistoryList();
    }
}

function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function handleImageSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
        currentBase64Image = event.target.result;
        const previewArea = document.getElementById("imagePreviewArea");
        if (previewArea) {
            previewArea.innerHTML = `<img src="${currentBase64Image}" class="thumb-preview">`;
        }
    };
    reader.readAsDataURL(file);
}

async function sendMessage() {
    const input = document.getElementById("userInput");
    if (!input) return;

    const text = input.value.trim();
    const langSelect = document.getElementById("languageSelect");
    const selectedLang = langSelect ? langSelect.value : "Traditional Chinese";
    
    if (!text && !currentBase64Image) return;

    // 建立新對話 ID
    if (!currentChatId) {
        currentChatId = Date.now().toString();
        chatSessions[currentChatId] = {
            title: text || "圖片對話",
            messages: []
        };
    }

    const chatBox = document.getElementById("chatBox");

    // 保存使用者訊息到歷史紀錄
    chatSessions[currentChatId].messages.push({
        role: "user",
        text: text,
        image: currentBase64Image
    });
    saveSessionsToStorage();
    renderHistoryList();

    // 使用者介面渲染
    const userRow = document.createElement("div");
    userRow.className = "message-row user";
    let userHtml = `<div class="message-content">`;
    if (currentBase64Image) {
        userHtml += `<img src="${currentBase64Image}" class="preview-img">`;
    }
    userHtml += `${escapeHtml(text)}</div><div class="avatar user-avatar">你</div>`;
    userRow.innerHTML = userHtml;
    chatBox.appendChild(userRow);

    input.value = "";
    const previewArea = document.getElementById("imagePreviewArea");
    if (previewArea) previewArea.innerHTML = "";
    
    const sendImg = currentBase64Image;
    currentBase64Image = null;

    // AI 回應欄位
    const aiRow = document.createElement("div");
    aiRow.className = "message-row ai";
    aiRow.innerHTML = `<div class="avatar ai-avatar">✦</div><div class="message-content" id="currentAiMsg"></div>`;
    chatBox.appendChild(aiRow);

    const aiMsgDiv = aiRow.querySelector("#currentAiMsg");
    chatBox.scrollTop = chatBox.scrollHeight;

    const stopBtn = document.getElementById("stopBtn");
    const sendBtn = document.getElementById("sendBtn");
    if (stopBtn) stopBtn.style.display = "inline-block";
    if (sendBtn) sendBtn.style.display = "none";

    abortController = new AbortController();
    let fullAiResponse = "";

    try {
        const response = await fetch("https://ai2-9ewx.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            signal: abortController.signal,
            body: JSON.stringify({ 
                message: text,
                image: sendImg ? sendImg.split(',')[1] : null,
                language: selectedLang
            })
        });

        if (!response.ok) throw new Error("Server error: " + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            fullAiResponse += chunk;
            aiMsgDiv.innerText = fullAiResponse;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

    } catch (err) {
        if (err.name === 'AbortError') {
            fullAiResponse += " [已停止生成]";
            aiMsgDiv.innerText = fullAiResponse;
        } else {
            fullAiResponse = "連線失敗，請檢查 Render 後端狀態。";
            aiMsgDiv.innerText = fullAiResponse;
            console.error(err);
        }
    } finally {
        // 保存 AI 回應到歷史紀錄
        if (chatSessions[currentChatId]) {
            chatSessions[currentChatId].messages.push({
                role: "ai",
                text: fullAiResponse
            });
            saveSessionsToStorage();
        }

        if (stopBtn) stopBtn.style.display = "none";
        if (sendBtn) sendBtn.style.display = "flex";
        aiMsgDiv.removeAttribute("id");
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

function stopGeneration() {
    if (abortController) abortController.abort();
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
</body>
</html>
