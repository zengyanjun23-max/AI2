<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 對話助手</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #007bff;
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background-color: #007bff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #212529;
            border-bottom-left-radius: 4px;
        }
        .input-container {
            display: flex;
            padding: 12px;
            background-color: #ffffff;
            border-top: 1px solid #dee2e6;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">AI 對話助手</div>
        <div id="chat-box" class="chat-box"></div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="輸入訊息..." onkeydown="handleKeyPress(event)">
            <button onclick="sendMessage()">發送</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");

            // 1. 先顯示使用者輸入的真實文字
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user";
            userMsgDiv.textContent = text;
            chatBox.appendChild(userMsgDiv);

            // 清空輸入框
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. 顯示 AI 思考中
            const aiMsgDiv = document.createElement("div");
            aiMsgDiv.className = "message ai";
            aiMsgDiv.textContent = "思考中...";
            chatBox.appendChild(aiMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 將 text 變數放入 JSON body 中傳給後端
                const response = await fetch("https://ai2-9ewx.onrender.com/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP 錯誤：${response.status}`);
                }

                const data = await response.json();

                if (data && data.reply) {
                    aiMsgDiv.textContent = data.reply;
                } else {
                    aiMsgDiv.textContent = "收到空回應，請檢查資料結構。";
                }
            } catch (error) {
                aiMsgDiv.textContent = "連線失敗，請稍後再試。";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
