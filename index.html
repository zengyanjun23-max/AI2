<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background-color: #2b2c2e; }
        .ai-message { align-self: flex-start; background-color: #1e1f20; }
        .input-container { padding: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #3c4043; background: #1e1f20; color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #1a73e8; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="輸入訊息...">
        <button onclick="sendMessage()">發送</button>
    </div>

<script>
async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    const chatBox = document.getElementById("chatBox");

    const userDiv = document.createElement("div");
    userDiv.className = "message user-message";
    userDiv.innerText = text;
    chatBox.appendChild(userDiv);
    input.value = "";

    const aiDiv = document.createElement("div");
    aiDiv.className = "message ai-message";
    aiDiv.innerText = "思考中...";
    chatBox.appendChild(aiDiv);

    try {
        const response = await fetch("https://ai2-9ewx.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, language: "Traditional Chinese" })
        });

        if (!response.ok) throw new Error("HTTP error " + response.status);

        aiDiv.innerText = "";
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            aiDiv.innerText += decoder.decode(value, { stream: true });
        }

    } catch (err) {
        aiDiv.innerText = "連線失敗，請檢查 Render 後端狀態。";
        console.error(err);
    }
}
</script>
</body>
</html>
